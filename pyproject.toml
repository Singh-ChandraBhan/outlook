[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Offline-first enterprise knowledge ingestion and grounded RAG demo"
requires-python = ">=3.10"
dependencies = [
  "azure-identity>=1.17", "azure-storage-blob>=12.22",
  "azure-search-documents>=11.6.0", "openai>=1.50",
  "requests>=2.32", "openpyxl>=3.1", "streamlit>=1.38", "typer>=0.12"
]

[project.scripts]
eka = "enterprise_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
